<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend + Backend</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 400px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #ddd;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #00c896;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #00e0aa;
        }

        #mensagem {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">

        <h1>Projeto Full Stack 🚀</h1>

        <p>
            Clique no botão para conectar o frontend ao backend.
        </p>

        <button onclick="conectarBackend()">
            Conectar Backend
        </button>

        <div id="mensagem"></div>

    </div>

    <script>

        async function conectarBackend() {

            const mensagem = document.getElementById("mensagem");

            mensagem.innerText = "Conectando ao backend...";

            try {

                const resposta = await fetch("http://IP_DO_SERVIDOR:5000");

                const dados = await resposta.json();

                mensagem.innerText =
                    dados.mensagem + " | Status: " + dados.status;

            } catch (erro) {

                mensagem.innerText =
                    "Erro ao conectar com o backend ❌";

                console.error(erro);
            }
        }

    </script>

</body>
</html>
